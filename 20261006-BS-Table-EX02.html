<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableEX02</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/myall.css">
</head>
<style>
    .box01 {
        height: 150px;
    }

    .box02 {
        height: 150px;
        width: 150px;
        border-radius: 100%;
    }

    .myimg {
        width: 100%;
        height: 150px;
    }

    .tbimg {
        height: 300px;
        width: 100%;
    }
    .footer{
        height: 50px;
        width: 100%;
        background: #000;
        flood-color: aliceblue;
        text-align: center;
    }
    @media screen and (min-width: 1024px) {
        .box01{
             height: 220px;
            width: 220px;
        border-radius: 50%;
        }
    }
</style>

<body>
    <div class="warpper p-4">
        <img src="image/LOGO01.avif" class="myimg col-12 d-none d-md-block" alt="">
        <div class="row  g-1 mt-3">
            <div class="col-sm-12 col-md-6 col-lg-3 ">
                <div class="box01 bg-success title01  text-center  ">選單01</div>
            </div>
            <div class="col-sm-12 col-md-6 col-lg-3 ">
                <div class="box01 bg-success title01  text-center ">選單02</div>
            </div>
            <div class="col-sm-12 col-md-6 col-lg-3 ">
                <div class="box01 bg-success title01   text-center ">選單03</div>
            </div>
            <div class="col-sm-12 col-md-6 col-lg-3 ">
                <div class="box01 bg-success title01   text-center ">選單04</div>
            </div>
            <!-- <div class="d-none d-xl-block col-xl-3">
                <div class="box02 bg-success text-center title01 ">選單01</div>
            </div>
            <div class="d-none d-xl-block col-xl-3">
                <div class="box02 bg-success text-center title01 ">選單02</div>
            </div>
            <div class="d-none d-xl-block col-xl-3">
                <div class="box02 bg-success text-center title01 ">選單03</div>
            </div>
            <div class="d-none d-xl-block col-xl-3">
                <div class="box02 bg-success text-center title01 ">選單04</div> -->
            </div>

        </div>
        <div class="container">
            <div class="row mt-3 " id="travelfood">
                <div class=" col-sm-12 col-md-12 col-lg-6  col-xl-4">
                    <div class="card">
                        <img src="image/LOGO01.avif" class="tbimg" alt="">
                        <div class="cardbody">

                            <h1 class="title02">介紹</h1>
                            <div class="h6">姓名</div>
                            <div class="h6">地址</div>
                            <div class="h6">電話</div>
                            <div class="h6">簡介</div>
                        </div>
                    </div>
                </div>
                

            </div>
        </div>
    </div>
    <div class="footer d-none d-md-block">
        <p class="title04">2026.10.08 BY:XXXX</p>
    </div>




    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script>
        $(function(){
            $.ajax({
                type:"GET",
                url:"http://localhost:3000/product",
                dataType:"json",
                success:showdata,
                error:function(){
                    console.log("介接失敗");
                    alert("介接失敗");
                }
            });
        });

        function showdata(data){
            console.log(data);

            data.forEach(function(item){
                const strHTML =`<div class=" col-sm-12 col-md-12 col-lg-6  col-xl-4">
                    <div class="card">
                        <img src="${item.PicURL}" class="tbimg" alt="">
                        <div class="cardbody">

                            <h1 class="title02">介紹</h1>
                            <div class="h6">${item.Name}</div>
                            <div class="h6">${item.City}${item.Town}${item.Address}</div>
                            <div class="h6">${item.Tel}</div>
                            <div class="h6">${item.HostWords}</div>
                        </div>
                    </div>
                </div>`
                $("#travelfood").append(strHTML);
            })
        }
    </script>

</body>

</html>
